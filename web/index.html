<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋 · Chinese Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- 左侧：棋盘画布 -->
        <div class="board-wrap">
            <canvas id="board" width="592" height="656"></canvas>
            <div id="overlay" class="overlay hidden">
                <div id="overlayText">正在连接引擎服务…</div>
            </div>
        </div>

        <!-- 右侧：信息与控制面板 -->
        <div class="panel">
            <h1>中国象棋</h1>

            <div class="status">
                <div id="turnText" class="turn">—</div>
                <div id="checkText" class="check"></div>
            </div>

            <div class="controls">
                <div class="row">
                    <label for="modeSel">模式</label>
                    <select id="modeSel">
                        <option value="pve_red">人机 · 我执红先手</option>
                        <option value="pve_black">人机 · 我执黑后手</option>
                        <option value="pvp">双人对战</option>
                    </select>
                </div>
                <div class="row buttons">
                    <button id="btnNew">新对局</button>
                    <button id="btnUndo">悔棋</button>
                    <button id="btnAi">电脑代走</button>
                </div>
            </div>

            <div id="engineInfo" class="engine-info">引擎：未思考</div>

            <div class="history">
                <h2>走子记录</h2>
                <ol id="historyList"></ol>
            </div>
        </div>
    </div>

    <!-- 对局结束弹窗 -->
    <div id="endModal" class="end-modal hidden">
        <div class="end-card">
            <div id="endTitle" class="end-title">胜利</div>
            <div id="endSub" class="end-sub"></div>
            <div class="end-actions">
                <button id="btnAgain">再来一局</button>
                <button id="btnClose">继续观棋</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
